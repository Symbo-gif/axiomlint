[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "axiomlint"
version = "0.0.1.dev0"
description = "Local-first evidence-carrying review: governed foundation"
requires-python = ">=3.12"
dependencies = []
license = {text = "MIT"}
authors = [{name = "Michael Maillet"}]

[project.scripts]
axiomlint = "axiomlint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

